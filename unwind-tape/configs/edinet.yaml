# unwind-tape / Task D — EDINET 母集団拡張の設定(docs/TASK_D_DESIGN.md)。
# EDINET API v2。売出し系書類(有価証券届出書ほか)を期間網羅で発見し、候補を出す。
# 数値の転記は一次(本文)からのみ。ここが出すのは lead(候補)だけ。創作禁止。

base_url: https://api.edinet-fsa.go.jp/api/v2
api_key_env: EDINET_API_KEY          # サブスクリプションキーは env のみ(コミット禁止)

date_from: "2023-01-01"              # 東証要請(2023-03)を触媒とする処置窓(TASK_D_DESIGN 確定)
date_to:   "2026-06-30"

request_sleep_sec: 0.3               # API への礼儀。429 はバックオフでリトライ
retries: 4                          # 指数バックオフ base=2s factor=2(Task A/C と統一)
backoff_base_sec: 2.0
backoff_factor: 2.0

# 候補として拾う doc type(実 EDINET コードで確認済み、2023-11-29 の生データより)。
target_doc_type_codes: ["030", "040", "100"]
#   030 有価証券届出書 / 040 訂正有価証券届出書 / 100 発行登録追補書類(shelf takedown、大企業の売出はこちらが多い)
#   ※ 130=訂正有報・140=四半期報告書 は offering ではないので除外(初回 config の誤りを訂正)
# ordinanceCode で母集団を「事業会社(株式)」に限定する。ここが最重要フィルタ:
#   010 企業内容等開示府令(=事業会社の株式) / 030 特定有価証券開示府令(=投資信託・REIT。除外)
target_ordinance_codes: ["010"]
# docDescription はタグ付けのみ(有価証券届出書本文の募集/売出は step2 で判定。ここでは text 一致に頼らない)
uridashi_keywords: ["売出"]          # 稀に届出名に売出を含む → 弱いタグ
ipo_keywords: ["新規公開", "新規上場"]  # IPO は政策保有解消でない → step2 で除外するためタグ付け

output:
  raw_dir:        data/raw/edinet/documents     # {date}.json(生レスポンス、gitignore)
  manifest:       data/raw/edinet/manifest.jsonl
  candidates_csv: data/parsed/edinet/candidates.csv
  report_md:      data/parsed/edinet/edinet_report.md
