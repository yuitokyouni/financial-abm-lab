[project]
name = "financial-abm-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "polars",
    "scipy",
    "statsmodels",
    "matplotlib",
    "pydantic",
    "pyyaml",
    "pyarrow",
    "tqdm",
    "abm-models",
    "stylized-facts",
    "provenance",
    "fingerprint-atlas",
    "agora-engine",
    "yh010g",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "ipykernel",
]

# Shared packages and explicitly registered experiment-local packages.
[tool.uv.workspace]
members = ["packages/*", "experiments/YH010g"]
# YH012 has a separately installed local lobcore dependency.
exclude = ["experiments/YH012"]

[tool.uv.sources]
abm-models = { workspace = true }
stylized-facts = { workspace = true }
provenance = { workspace = true }
fingerprint-atlas = { workspace = true }
agora-engine = { workspace = true }
yh010g = { workspace = true }

[tool.pytest.ini_options]
# Make experiment modules importable with both pytest and python -m pytest.
pythonpath = ["."]
testpaths = ["tests", "packages", "experiments/YH007/tests", "experiments/YH009/tests", "experiments/YH010g/tests"]
addopts = "-q"
markers = ["slow: 重い実行 (T=20000 等)。CI 既定では除外"]