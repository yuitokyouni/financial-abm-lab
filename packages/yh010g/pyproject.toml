[project]
name = "yh010g"
version = "0.1.0"
description = "YH010-g ワークストリームA: 議決権行使個別開示の取得・正規化・行列構築 (specs/YH010g_HANDOFF.md §4)"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "openpyxl", "agora-engine"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yh010g"]

[tool.uv.sources]
agora-engine = { workspace = true }
