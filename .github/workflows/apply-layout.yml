name: Apply experiment layout
on:
  push:
    branches: [refactor/experiment-layout-20260919]
    paths: [.github/workflows/apply-layout.yml]
permissions:
  contents: write
concurrency:
  group: experiment-layout-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/experiment-layout-20260919
          fetch-depth: 20
      - uses: astral-sh/setup-uv@v5
      - name: Python and original locked environment
        run: |
          uv python install 3.11
          uv sync --locked --extra dev
      - name: Baseline tests before moving files
        id: baseline
        continue-on-error: true
        run: |
          set -o pipefail
          uv run --locked pytest -m 'not slow' --junitxml=/tmp/layout-before.xml 2>&1 | tee /tmp/layout-before.log
      - name: Apply inspected changes and verify preserved evidence
        run: python _layout_migration/apply.py
      - name: Validate new workspace and layout
        run: |
          uv sync --locked --extra dev
          uv run --locked python tools/check_layout.py
          git diff --check
      - name: Tests after migration
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          uv run --locked pytest -m 'not slow' --junitxml=/tmp/layout-after.xml 2>&1 | tee /tmp/layout-after.log
      - name: Commit to the dedicated branch only
        env:
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          AFTER_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          test "$(git branch --show-current)" = refactor/experiment-layout-20260919
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat > /tmp/layout-stat.txt
          git commit -m 'refactor: group experiment assets and separate shared code'
          python - <<'PY'
          import json, os, pathlib, subprocess
          result = {"commit": subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(), "baseline":os.environ['BASELINE_OUTCOME'], "tests":os.environ['AFTER_OUTCOME']}
          pathlib.Path('/tmp/layout-result.json').write_text(json.dumps(result, indent=2))
          PY
          git push origin HEAD:refactor/experiment-layout-20260919
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-verification
          path: /tmp/layout-*
          retention-days: 7
      - name: Report failing tests
        if: steps.tests.outcome == 'failure'
        run: exit 1
