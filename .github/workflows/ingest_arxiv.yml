name: ingest-arxiv

# Pull the last week's worth of financial-ABM papers from arxiv, extract
# structured info via the configured LLM, and accumulate them in the
# literature DB. Run weekly so the corpus stays current automatically.

on:
  schedule:
    # Every Sunday 21:00 UTC (= Monday 06:00 JST). Runs before propose.
    - cron: "0 21 * * 0"
  workflow_dispatch:
    inputs:
      preset:
        description: "arxiv query preset (financial_abm_strict / financial_abm / foundational_abm)"
        required: false
        default: "financial_abm_strict"
      max_results:
        description: "max papers per call"
        required: false
        default: "50"
      no_extract:
        description: "metadata only, skip LLM extraction"
        required: false
        default: "false"
      model:
        description: "LLM model id (openai/gpt-4o-mini → OpenAI, openai/gpt-oss-120b → Groq)"
        required: false
        default: "openai/gpt-4o-mini"

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      DB_PATH: data/abm_knowhow.db
      PRESET: ${{ github.event.inputs.preset || 'financial_abm_strict' }}
      MAX: ${{ github.event.inputs.max_results || '50' }}
      LLM_MODEL: ${{ github.event.inputs.model || 'openai/gpt-4o-mini' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync workspace
        run: uv sync

      - name: Restore literature snapshot from previous run (if any)
        # We track a small JSON dump of the literature_methods table at
        # data/literature_methods.json so each Actions run can resume from
        # the accumulated knowledge rather than starting empty.
        run: |
          mkdir -p data
          if [ -f data/literature_methods.json ]; then
            echo "found existing snapshot"
            ls -la data/literature_methods.json
          else
            echo "no snapshot yet (first run)"
          fi

      - name: Materialise DB from snapshot
        # Full-fidelity restore (all columns incl. enrichment). The old
        # inline restore only re-wrote metadata + extraction fields, so
        # code_url / oa_* / s2_* / user_notes were silently wiped every
        # cycle. snapshot-restore round-trips losslessly with snapshot-save.
        run: |
          if [ -f data/literature_methods.json ]; then
            uv run python -m fingerprint_atlas.arxiv_cli \
              --db "$DB_PATH" snapshot-restore \
              --snapshot data/literature_methods.json
          else
            echo "no snapshot; literature_methods starts empty"
          fi

      - name: Ingest new arxiv papers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          NO_EXTRACT="${{ github.event.inputs.no_extract || 'false' }}"
          if [ "$NO_EXTRACT" != "true" ]; then
            case "$LLM_MODEL" in
              openai/gpt-4o*|openai/gpt-4-turbo*|openai/gpt-4.1*|openai/gpt-3.5*|openai/o1*|openai/o3*|openai/o4*)
                if [ -z "$OPENAI_API_KEY" ]; then
                  echo "::error::OPENAI_API_KEY secret is not set but LLM_MODEL=$LLM_MODEL routes to OpenAI."
                  exit 1
                fi
                ;;
              *)
                if [ -z "$GROQ_API_KEY" ]; then
                  echo "::error::GROQ_API_KEY secret is not set but LLM_MODEL=$LLM_MODEL routes to Groq."
                  exit 1
                fi
                ;;
            esac
          fi
          ARGS="--preset $PRESET --max $MAX --min-relevance-to-keep 0.3 --groq-model $LLM_MODEL"
          if [ "$NO_EXTRACT" = "true" ]; then ARGS="$ARGS --no-extract"; fi
          uv run python -m fingerprint_atlas.arxiv_cli \
            --db "$DB_PATH" ingest $ARGS

      - name: Dump literature_methods snapshot to JSON
        # Full-fidelity dump (same code path as local snapshot-save), so
        # the committed JSON round-trips losslessly with the restore step.
        run: |
          uv run python -m fingerprint_atlas.arxiv_cli \
            --db "$DB_PATH" snapshot-save --out data/literature_methods.json

      - name: Open PR with snapshot diff
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ingest-arxiv/${{ github.run_id }}
          base: main
          add-paths: |
            data/literature_methods.json
          commit-message: "ingest-arxiv: weekly snapshot (run ${{ github.run_id }})"
          title: "Weekly arxiv literature snapshot — ${{ github.run_id }}"
          body: |
            New papers ingested from arxiv (preset: `${{ env.PRESET }}`,
            max: `${{ env.MAX }}`). Extraction via `${{ env.LLM_MODEL }}`.

            The JSON snapshot under `data/literature_methods.json` is the
            source of truth for the literature DB — re-run any propose
            workflow and these papers will be available as LLM context.

            **Review hints**
            - Spot-check 2-3 entries: does `mechanism_summary` describe what
              the abstract actually says?
            - Drop rows with low `relevance_score` by editing the JSON.
            - Or just merge — the next ingest accumulates on top via the
              snapshot restore step.
          delete-branch: true
