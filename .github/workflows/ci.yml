name: CI

on:
  push:
    branches: [main, consolidation]
  pull_request:

# Shared code plus explicitly selected experiment-local tests.
# imported/ の旧 experiment 群は依存未統一のため対象外 (順次 experiments/ へ移行)。
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync workspace
        run: uv sync --locked --extra dev
      - name: Lint (packages + experiments)
        run: uv run ruff check packages experiments src tests || true
      - name: Test (fast; slow parity excluded)
        run: uv run pytest -m "not slow"
      - name: Repository ownership and structure
        run: uv run python tools/check_layout.py
